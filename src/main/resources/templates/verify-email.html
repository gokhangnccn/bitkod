<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hesabını Doğrula</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f3f4f6; font-family: Arial, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">
            <table width="600" style="background-color: #ffffff; padding: 40px; border-radius: 10px; margin: 40px 0;">
                <tr>
                    <td style="text-align: center;">
                        <h2 style="color: #111827; font-size: 24px;">👋 Hoş geldin, <span th:text="${username}">Kullanıcı</span>!</h2>
                        <p style="color: #374151; font-size: 16px;">
                            Hesabını aktifleştirmek için aşağıdaki butona tıkla:
                        </p>
                        <a th:href="${verifyUrl}" style="display: inline-block; background-color: #4f46e5; color: white; padding: 14px 28px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px;">
                            Hesabımı Doğrula
                        </a>
                        <p style="color: #6b7280; font-size: 14px; margin-top: 30px;">
                            Eğer bu isteği siz yapmadıysanız, bu e-postayı güvenle göz ardı edebilirsiniz.
                        </p>
                        <hr style="margin: 30px 0; border: none; border-top: 1px solid #e5e7eb;" />
                        <p style="color: #9ca3af; font-size: 12px;">
                            Bu e-posta Bitkod sisteminden otomatik olarak gönderilmiştir.
                        </p>
                        <p style="color: #6b7280; font-size: 14px;">Sevgilerle, <br/> Bitkod Ekibi</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
